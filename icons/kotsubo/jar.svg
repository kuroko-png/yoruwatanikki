<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 156">
  <!-- ミニゲーム「遺物を求める者」の小壺（ゲームの小壺をデフォルメした、このアプリ用の絵）。
       座って、枝のような腕を左右に伸ばしている（左は下へ、右は上へ）。
       src/app/kotsubo.js の JAR_SVG と同じ絵（あちらは、叩くと腕をしまう動き付き） -->
  <defs>
    <radialGradient id="kj-body" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#e9cf95"/><stop offset=".65" stop-color="#c9a062"/><stop offset="1" stop-color="#9c7440"/>
    </radialGradient>
  </defs>
  <ellipse cx="122" cy="146" rx="60" ry="6" fill="#000" opacity=".35"/>
  <!-- 左腕（下へ伸ばす） -->
  <g class="kj-arm kj-arm-l">
    <path d="M86 84 C70 88 54 96 40 104 C32 108 24 112 16 116" fill="none" stroke="#1f1612" stroke-width="13" stroke-linecap="round"/>
    <path d="M86 84 C70 88 54 96 40 104 C32 108 24 112 16 116" fill="none" stroke="#4c3a2f" stroke-width="7" stroke-linecap="round"/>
    <g fill="#4c3a2f" stroke="#1f1612" stroke-width="2.5"><circle cx="62" cy="92" r="5"/><circle cx="38" cy="105" r="4"/></g>
    <path d="M16 116 l-9 -6 M16 116 l-11 2 M16 116 l-7 9 M16 116 l1 10" fill="none" stroke="#1f1612" stroke-width="6" stroke-linecap="round"/>
    <path d="M16 116 l-9 -6 M16 116 l-11 2 M16 116 l-7 9 M16 116 l1 10" fill="none" stroke="#4c3a2f" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- 右腕（上へ伸ばす） -->
  <g class="kj-arm kj-arm-r">
    <path d="M158 70 C174 62 190 54 204 46 C212 42 220 38 228 32" fill="none" stroke="#1f1612" stroke-width="13" stroke-linecap="round"/>
    <path d="M158 70 C174 62 190 54 204 46 C212 42 220 38 228 32" fill="none" stroke="#4c3a2f" stroke-width="7" stroke-linecap="round"/>
    <g fill="#4c3a2f" stroke="#1f1612" stroke-width="2.5"><circle cx="182" cy="58" r="5"/><circle cx="208" cy="44" r="4"/></g>
    <path d="M228 32 l4 -10 M228 32 l10 -5 M228 32 l11 3 M228 32 l7 8" fill="none" stroke="#1f1612" stroke-width="6" stroke-linecap="round"/>
    <path d="M228 32 l4 -10 M228 32 l10 -5 M228 32 l11 3 M228 32 l7 8" fill="none" stroke="#4c3a2f" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- 胴（壺） -->
  <ellipse cx="122" cy="90" rx="44" ry="40" fill="url(#kj-body)" stroke="#1f1612" stroke-width="4"/>
  <!-- 肩の輪（腕の付け根） -->
  <g fill="#4c3a2f" stroke="#1f1612" stroke-width="3"><circle cx="84" cy="83" r="6.5"/><circle cx="160" cy="70" r="6.5"/></g>
  <!-- 帯の飾り -->
  <path d="M80 72 C104 80 140 80 164 72" fill="none" stroke="#5a3d22" stroke-width="3" stroke-linecap="round"/>
  <path d="M79 92 C104 100 140 100 165 92" fill="none" stroke="#5a3d22" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#6e4c2b" stroke-width="2.2" stroke-linecap="round">
    <path d="M92 84 q5 -6 10 0 q5 6 10 0"/><path d="M118 86 q5 -6 10 0 q5 6 10 0"/><path d="M144 84 q5 -6 10 0"/>
  </g>
  <g fill="#7a5530" opacity=".55"><circle cx="102" cy="112" r="1.8"/><circle cx="126" cy="117" r="1.6"/><circle cx="146" cy="108" r="1.8"/><circle cx="112" cy="104" r="1.3"/></g>
  <path d="M96 66 C92 76 92 90 96 102" fill="none" stroke="#fff2cf" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <!-- 口（ふちと、中の赤い布） -->
  <ellipse cx="122" cy="56" rx="36" ry="10" fill="#d7b77c" stroke="#1f1612" stroke-width="4"/>
  <ellipse cx="122" cy="55" rx="28" ry="6.5" fill="#a3362a"/>
  <path d="M98 54 q24 -5 48 0" fill="none" stroke="#c9564a" stroke-width="2" opacity=".8"/>
  <!-- 脚（座っている。左足は下、右足は上げる） -->
  <g class="kj-legs">
    <path d="M110 124 C106 130 102 136 98 142" fill="none" stroke="#1f1612" stroke-width="12" stroke-linecap="round"/>
    <path d="M110 124 C106 130 102 136 98 142" fill="none" stroke="#4c3a2f" stroke-width="6" stroke-linecap="round"/>
    <path d="M98 142 l-9 1 M98 142 l-6 6 M98 142 l2 7" fill="none" stroke="#1f1612" stroke-width="6" stroke-linecap="round"/>
    <path d="M98 142 l-9 1 M98 142 l-6 6 M98 142 l2 7" fill="none" stroke="#4c3a2f" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M136 124 C144 126 150 120 152 110" fill="none" stroke="#1f1612" stroke-width="12" stroke-linecap="round"/>
    <path d="M136 124 C144 126 150 120 152 110" fill="none" stroke="#4c3a2f" stroke-width="6" stroke-linecap="round"/>
    <path d="M152 110 l-4 -9 M152 110 l3 -10 M152 110 l9 -5" fill="none" stroke="#1f1612" stroke-width="6" stroke-linecap="round"/>
    <path d="M152 110 l-4 -9 M152 110 l3 -10 M152 110 l9 -5" fill="none" stroke="#4c3a2f" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
